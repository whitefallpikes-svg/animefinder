<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeSearch</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#0b0d12;color:#e8eaf0}
a{color:#8ab4ff}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(11,13,18,.9);backdrop-filter:blur(10px);border-bottom:1px solid #1e2330}
.brand{font-weight:800;letter-spacing:.5px}
.brand span{color:#7c5cff}
.searchwrap{flex:1;display:flex;gap:8px;max-width:860px;margin:0 auto}
input,select,textarea{background:#12151d;border:1px solid #232a3a;color:#e8eaf0;border-radius:12px;padding:10px 12px;font-size:14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#7c5cff}
.btn{background:linear-gradient(135deg,#7c5cff,#4f8cff);border:0;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}
.btn.ghost{background:#161a24;border:1px solid #262d3d;color:#cfd6e4}
.small{padding:7px 10px;border-radius:10px;font-size:12px}
.status{color:#9aa4b8;font-size:13px;padding:8px 2px}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 57px)}
.sidebar{border-right:1px solid #1e2330;padding:14px;display:flex;flex-direction:column;gap:8px}
.sidebtn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#12151d;border:1px solid #232a3a;color:#dbe2ee;text-align:left}
.sidebtn.active{border-color:#7c5cff;background:#171327}
.content{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{position:relative;border-radius:14px;overflow:hidden;border:1px solid #232a3a;background:#12151d}
.card img{width:100%;height:230px;object-fit:cover;display:block;cursor:pointer}
.card .meta{padding:8px 10px;font-size:12px;color:#aab3c5;display:flex;justify-content:space-between;gap:6px}
.chip{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:999px;font-size:11px}
.fav{position:absolute;top:6px;right:6px;background:#161a24;border:1px solid #2a3245;color:#ffd166;border-radius:10px;padding:5px 8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.citem{position:relative;border-radius:12px;overflow:hidden;border:1px solid #232a3a}
.citem img{width:100%;height:170px;object-fit:cover;display:block;cursor:pointer}
.citem.dragging{opacity:.4}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
.viewer.open{display:flex}
.viewer img{max-width:92vw;max-height:82vh;border-radius:12px}
.viewer .actions{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.toast{position:fixed;bottom:18px;right:18px;background:#171a24;border:1px solid #2a3245;padding:10px 14px;border-radius:12px;display:none;z-index:120}
.toast.show{display:block}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Anime<span>Search</span></div>
  <div class="searchwrap">
    <input id="q" placeholder="Ara..." autocomplete="off" spellcheck="false">
    <select id="type" style="max-width:130px">
      <option value="">Tümü</option>
      <option value="anime">Anime</option>
      <option value="manga">Manga</option>
    </select>
    <button class="btn" id="searchBtn">Ara</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <button class="sidebtn active" data-view="search">🔍 Arama</button>
    <button class="sidebtn" data-view="fav">❤️ Favoriler</button>
    <button class="sidebtn" data-view="saved">📁 Kaydedilenler</button>
    <button class="sidebtn" data-view="history">🕘 Geçmiş</button>
  </aside>
  <main class="content">
    <div id="viewSearch">
      <div class="status" id="status">Hazır.</div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="viewFav" style="display:none">
      <h3>❤️ Favoriler</h3>
      <div class="cgrid" id="favGrid"></div>
    </div>
    <div id="viewSaved" style="display:none">
      <h3>📁 Kaydedilenler</h3>
      <div class="cgrid" id="savedGrid"></div>
    </div>
    <div id="viewHistory" style="display:none">
      <h3>🕘 Geçmiş</h3>
      <div id="historyList" class="status"></div>
    </div>
  </main>
</div>

<div class="viewer" id="viewer">
  <img id="viewerImg">
  <div class="actions">
    <button class="btn" id="saveBtn">📁 Kaydet</button>
    <button class="btn ghost" id="favBtn">❤️ Favori</button>
    <button class="btn ghost" id="closeViewer">Kapat</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let state=JSON.parse(localStorage.getItem('anime_state')||'{}');
state.favorites=state.favorites||[];state.saved=state.saved||[];state.history=state.history||[];
let current=null,view='search';

function persist(){localStorage.setItem('anime_state',JSON.stringify(state))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}

function card(x){
 const d=document.createElement('div');d.className='card';
 const img=document.createElement('img');img.src=x.thumb;img.loading='lazy';
 img.onclick=()=>openViewer(x);
 const meta=document.createElement('div');meta.className='meta';
 meta.innerHTML='<span>'+(x.title||'')+'</span>';
 const fav=document.createElement('button');fav.className='fav';fav.textContent=state.favorites.some(f=>f.thumb===x.thumb)?'★':'☆';
 fav.onclick=e=>{e.stopPropagation();toggleFav(x)};
 d.appendChild(img);d.appendChild(meta);d.appendChild(fav);
 return d;
}

function renderResults(items){
 const g=$('#grid');g.innerHTML='';
 if(!items.length){$('#status').textContent='Sonuç yok.';return}
 items.forEach(x=>g.appendChild(card(x)));
 $('#status').textContent=items.length+' sonuç';
}

async function search(){
 const q=$('#q').value.trim();if(!q)return;
 $('#status').textContent='Aranıyor…';
 try{
  const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&type='+$('#type').value);
  const data=await r.json();
  renderResults(data.items||[]);
  if(!state.history.includes(q)){state.history.unshift(q);state.history=state.history.slice(0,30);persist()}
 }catch(e){$('#status').textContent='Arama hatası'}
}

function openViewer(x){current=x;$('#viewerImg').src=x.full||x.thumb;$('#viewer').classList.add('open')}
$('#closeViewer').onclick=()=>$('#viewer').classList.remove('open');

function toggleFav(x){
 const i=state.favorites.findIndex(f=>f.thumb===x.thumb);
 if(i>-1){state.favorites.splice(i,1);toast('Favoriden çıkarıldı')}
 else{state.favorites.unshift(x);toast('Favorilere eklendi')}
 persist();renderCollections();
}

$('#saveBtn').onclick=()=>{
 if(!current)return;
 if(!state.saved.some(s=>s.thumb===current.thumb)){state.saved.unshift(current);persist();toast('Kaydedildi');renderCollections()}
 else toast('Zaten kayıtlı');
};
$('#favBtn').onclick=()=>{if(current)toggleFav(current)};

function renderCollections(){
 const fg=$('#favGrid'),sg=$('#savedGrid');
 fg.innerHTML='';sg.innerHTML='';
 state.favorites.forEach(x=>fg.appendChild(collectionItem(x,'fav')));
 state.saved.forEach(x=>sg.appendChild(collectionItem(x,'saved')));
}

function collectionItem(x,mode){
 const d=document.createElement('div');d.className='citem';
 const img=document.createElement('img');img.src=x.thumb;img.onclick=()=>openViewer(x);
 const del=document.createElement('button');del.className='small ghost';del.textContent='✖';
 del.style.cssText='position:absolute;top:6px;right:6px';
 del.onclick=e=>{e.stopPropagation();
  const arr=mode==='fav'?state.favorites:state.saved;
  const i=arr.findIndex(a=>a.thumb===x.thumb);
  if(i>-1){arr.splice(i,1);persist();renderCollections();toast('Kaldırıldı')}
 };
 d.appendChild(img);d.appendChild(del);
 return d;
}

function showView(v){
 view=v;
 ['Search','Fav','Saved','History'].forEach(x=>$('#view'+x).style.display='none');
 $('#view'+v[0].toUpperCase()+v.slice(1)).style.display='block';
 document.querySelectorAll('.sidebtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
 if(v==='fav'||v==='saved')renderCollections();
 if(v==='history'){$('#historyList').textContent=state.history.join(' • ')||'Geçmiş boş'}
}

document.querySelectorAll('.sidebtn').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$('#searchBtn').onclick=search;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

renderCollections();
</script>
</body>
</html>
